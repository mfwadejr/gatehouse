# Serial console settings for the boot menu. This is the one place they are written down; the
# build reads it (brand-boot.sh and the boot hook) and docs/TEXT-INSTALL.md repeats it.
#
# These describe the boot MENU (GRUB). GRUB cannot detect a speed, so the menu only works over
# a cable set up exactly like this. Any value can be overridden for one build by setting the
# same name in the build environment, for example:  SERIAL_SPEED=115200 iso/build.sh ...
#
# The installer choices in the menu name their own speed (9600 and 115200) and need nothing here.
SERIAL_UNIT=${SERIAL_UNIT:-0}          # 0 = first port (COM1, ttyS0); 1 = second (COM2, ttyS1)
SERIAL_SPEED=${SERIAL_SPEED:-9600}     # baud
SERIAL_WORD=${SERIAL_WORD:-8}          # data bits
SERIAL_PARITY=${SERIAL_PARITY:-no}     # no, odd or even
SERIAL_STOP=${SERIAL_STOP:-1}          # stop bits
# Terminal type the keyboard keys are sent as: VT100 (arrows are Esc [ A). Set the same in the
# device's own serial-console settings and in your terminal program. No flow control.
SERIAL_TERM=vt100
