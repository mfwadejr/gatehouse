name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  binary:
    name: Console and program
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Build the console
        working-directory: web
        run: npm ci && npm run lint:tokens || true && npm run build
      - name: Check design tokens
        working-directory: web
        run: node ../tokens/check-tokens.mjs src/styles.css || true
      - name: Test
        run: |
          go vet ./...
          go test ./...
          # The firewall and routing tests build real networks, which needs root.
          sudo apt-get install -y nftables iproute2 >/dev/null
          sudo -E env "PATH=$PATH" go test -count=1 ./internal/fw ./internal/wanmon ./internal/privsep
      - name: Build the program
        run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o gatehouse ./cmd/gatehouse
      - uses: actions/upload-artifact@v4
        with: { name: gatehouse-binary, path: gatehouse, retention-days: 7 }

  iso:
    name: Installer image
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: gatehouse-binary, path: bin }
      - name: Build the image in a Debian 13 container
        run: |
          chmod +x bin/gatehouse
          mkdir -p out
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux syslinux-common isolinux ca-certificates
            OUT=/src/out iso/build.sh /src/bin/gatehouse "${VERSION}"
          '
        env:
          VERSION: ${{ needs.binary.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: gatehouse-iso
          path: out/*
          retention-days: 14
      - name: Publish a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" out/* --title "Gatehouse ${GITHUB_REF_NAME}" --generate-notes
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly out/* --prerelease --target "${GITHUB_SHA}" --title "Gatehouse nightly build" \
              --notes "Automatic build of the latest commit (${GITHUB_SHA::7}). For testing."
          fi
