name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  binary:
    name: Console and program
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Build the console
        working-directory: web
        run: npm ci && npm run lint:tokens || true && npm run build
      - name: Check design tokens
        working-directory: web
        run: node ../tokens/check-tokens.mjs src/styles.css || true
      - name: Test
        run: |
          set -o pipefail
          go vet ./...
          go test ./...
          # The firewall and routing tests build real networks out of namespaces, which needs root.
          # They skip themselves without it, so this step fails if any of them was skipped: a
          # silent skip would hide the very tests that prove the rules work.
          sudo apt-get install -y nftables iproute2 python3 util-linux >/dev/null
          sudo -E env "PATH=$PATH" go test -count=1 -v ./internal/fw ./internal/wanmon ./internal/privsep ./internal/netd ./internal/speedtest 2>&1 | tee root-tests.log
          if grep -E -- '--- SKIP|^\s+.*_test.go:[0-9]+: (needs|requires)' root-tests.log; then
            echo "A test that needs root was skipped."; exit 1
          fi
          grep -q -- '--- PASS: TestNetnsPolicy' root-tests.log
      - name: Build the program
        run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o gatehouse ./cmd/gatehouse
      - uses: actions/upload-artifact@v4
        with: { name: gatehouse-binary, path: gatehouse, retention-days: 7 }

  iso:
    name: Installer image
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: gatehouse-binary, path: bin }
      - name: Build the image in a Debian 13 container
        run: |
          chmod +x bin/gatehouse
          mkdir -p out
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux syslinux-common isolinux ca-certificates
            # Optional traffic-labelling program. A failure here only means the image has no gh-ndpi.
            (apt-get install -y --no-install-recommends gcc libc6-dev libndpi-dev libpcap-dev pkg-config >/dev/null 2>&1 && sh iso/ndpi/build.sh /src/iso/config/includes.chroot/usr/lib/gatehouse) || echo "gh-ndpi: skipped"
            OUT=/src/out iso/build.sh /src/bin/gatehouse "${VERSION}"
          '
        env:
          VERSION: ${{ needs.binary.outputs.version }}
      - name: Show the image size
        run: |
          cat out/size-report.txt >> "$GITHUB_STEP_SUMMARY"
          ls -l out/*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: gatehouse-iso
          path: out/*
          retention-days: 14
      - name: Sign the update package
        # Machines that are already installed update from this, so they never need a new image.
        # Needs the secret UPDATE_SIGNING_KEY (see docs/UPDATES.md); without it the release has only the image.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.binary.outputs.version }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::UPDATE_SIGNING_KEY is not set; this release has no update package"; exit 0; fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/update.key"
          chmod +x bin/gatehouse
          git log -1 --format=%B > "$RUNNER_TEMP/notes.txt"
          bin/gatehouse update-build -version "${VERSION}" -bin bin/gatehouse -units iso/config/includes.chroot/etc/systemd/system -packages iso/update-packages.list \
            -key "$RUNNER_TEMP/update.key" -notes "$RUNNER_TEMP/notes.txt" -out out
          rm -f "$RUNNER_TEMP/update.key"
      - name: Publish a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" out/* --title "Gatehouse ${GITHUB_REF_NAME}" --generate-notes
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly out/* --prerelease --target "${GITHUB_SHA}" --title "Gatehouse ${{ needs.binary.outputs.version }} (test build)" \
              --notes "Automatic build ${{ needs.binary.outputs.version }} of commit ${GITHUB_SHA::7}. For testing."
          fi
